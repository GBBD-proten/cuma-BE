name: Deploy Docker

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Docker login
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cumabe:latest .

      # 4. Docker push
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cumabe:latest

      # 5. ssh connect to server
      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/cumabe:latest
            docker stop cumabe || true
            docker rm cumabe || true
            docker run ${{ secrets.BACKEND_PATH }}:app/ -d --name cumabe -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/cumabe:latest
